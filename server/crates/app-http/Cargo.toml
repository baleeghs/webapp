[package]
name = "app-http"
version.workspace = true
edition.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
actix-cors = "0.7.2"
actix-files = "0.7.1"
actix-web = "4.17.0"
app-common = { version = "0.1.0", path = "../app-common" }
app-core = { version = "0.1.0", path = "../app-core" }
chrono = "0.4.45"
metrics = "0.24.6"
metrics-exporter-prometheus = "0.18.3"
serde = { version = "1.0.229", features = ["derive"] }
thiserror = "2.0.21"
tracing = "0.1.44"
tracing-actix-web = "0.7.25"
utoipa = { version = "6.0.0", features = ["actix_extras", "uuid", "chrono", "yaml"] }
uuid = "1.28.0"

[dev-dependencies]
app-core = { path = "../app-core", features = ["memory"] }
async-trait = "0.1.92"
serde_json = "1.0.154"
tokio = { version = "1.53.3", features = ["macros", "rt-multi-thread"] }
