name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  server:
    name: Server (Rust)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: app
          POSTGRES_PASSWORD: app
          POSTGRES_DB: app
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U app -d app" --health-interval 2s --health-timeout 3s --health-retries 20
    env:
      DATABASE_URL: postgres://app:app@localhost:5432/app
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-rust
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      # --include-ignored also runs the Postgres integration tests against the service above.
      - run: cargo test --workspace --locked -- --include-ignored

  web:
    name: Web (lint, types, unit, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-web
      - run: pnpm format:check
      - run: pnpm typecheck
      - run: pnpm lint
      - name: API types match server/openapi.yaml
        run: pnpm check:api
      - name: Generated palettes are current and pass contrast checks
        run: pnpm check:palettes
      - run: pnpm test:coverage
      - run: pnpm build
      - name: Bundle size budget
        run: node ../.github/scripts/bundle-report.mts

  e2e:
    name: Web (end-to-end)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-web
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm e2e
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: web/playwright-report
          retention-days: 7

  repo:
    name: Repository hygiene
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: ./.github/scripts/check-hygiene.sh
      - run: ./.github/scripts/check-docs-links.sh

  docker:
    name: Docker image builds
    runs-on: ubuntu-latest
    needs: [server, web]
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
