[package]
name = "app-cache"
version.workspace = true
edition.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
app-common = { version = "0.1.0", path = "../app-common" }
app-core = { version = "0.1.0", path = "../app-core" }
async-trait = "0.1.92"
chrono = "0.4.45"
moka = { version = "0.12.16", features = ["future"] }
uuid = "1.28.0"

[dev-dependencies]
app-core = { path = "../app-core", features = ["memory"] }
tokio = { version = "1.53.3", features = ["macros", "rt-multi-thread"] }
