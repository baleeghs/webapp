# Local infrastructure. `make db-up` starts Postgres; `docker compose --profile app up --build`
# also runs the production image against it.
services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: app
    ports:
      - '5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U app -d app']
      interval: 2s
      timeout: 3s
      retries: 20

  app:
    profiles: [app]
    build: .
    environment:
      DATABASE_URL: postgres://app:app@postgres:5432/app
    ports:
      - '8080:8080'
      - '50052:50052'
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres-data:
