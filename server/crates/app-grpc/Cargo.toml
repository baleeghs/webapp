[package]
name = "app-grpc"
version.workspace = true
edition.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
app-common = { version = "0.1.0", path = "../app-common" }
app-core = { version = "0.1.0", path = "../app-core" }
app-proto = { version = "0.1.0", path = "../app-proto" }
chrono = "0.4.45"
prost-types = "0.14.4"
thiserror = "2.0.21"
tonic = "0.14.6"
tonic-health = "0.14.6"
tonic-reflection = "0.14.6"
tracing = "0.1.44"
uuid = "1.28.0"

[dev-dependencies]
app-core = { path = "../app-core", features = ["memory"] }
tokio = { version = "1.53.3", features = ["macros", "rt-multi-thread"] }
