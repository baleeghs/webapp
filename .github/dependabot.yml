# Weekly grouped update PRs. Minor/patch updates land as one PR per ecosystem; majors stay
# separate so their breaking changes get reviewed on their own.
version: 2
updates:
  - package-ecosystem: cargo
    directory: /server
    schedule: { interval: weekly }
    groups:
      rust-minor:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /web
    schedule: { interval: weekly }
    groups:
      web-minor:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: monthly }

  - package-ecosystem: docker
    directory: /
    schedule: { interval: monthly }
